version: "3.8"

services:
  kong:
    image: kong:latest
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_MANAGER_LISTEN: 0.0.0.0:8002
    volumes:
      - ./config/kong.yml:/etc/kong/kong.yml
    ports:
      - "8000:8000"   # Proxy port
      - "8001:8001"   # Admin API
      - "8002:8002"